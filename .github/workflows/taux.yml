name: Surveillance des taux

# La Banque de France publie les donnees d'un mois environ cinq semaines apres
# sa fin : les chiffres de juillet 2026 sont parus le 7 septembre 2026. On passe
# le 12 pour laisser de la marge.
#
# Ce workflow ne modifie JAMAIS les taux du site. Il mesure la derive entre la
# grille en ligne et la statistique publique, et ouvre une issue quand elle
# depasse le seuil. Le choix du chiffre reste humain, parce que la statistique
# officielle est en retard de deux mois sur les baremes bancaires, et que l'OAT
# ne permet pas de corriger ce retard : voir docs/taux.md.
on:
  schedule:
    - cron: "0 7 12 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  surveiller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Mesurer la derive
        id: taux
        run: node scripts/maj-taux.mjs

      - name: Ouvrir une issue si la grille a derive
        if: steps.taux.outputs.alerte == 'oui'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DERIVE: ${{ steps.taux.outputs.derive }}
          BDF: ${{ steps.taux.outputs.bdf }}
          BDF_MOIS: ${{ steps.taux.outputs.bdf_mois }}
          OAT: ${{ steps.taux.outputs.oat }}
          OAT_MOIS: ${{ steps.taux.outputs.oat_mois }}
          GRILLE: ${{ steps.taux.outputs.grille }}
          GRILLE_MOIS: ${{ steps.taux.outputs.grille_mois }}
          REFERENCE: ${{ steps.taux.outputs.reference }}
        run: |
          cat > /tmp/corps.md <<EOF
          La statistique Banque de France a bouge de **$DERIVE point** depuis la
          derniere decision prise sur la grille.

          | | Valeur |
          |---|---|
          | Grille en ligne | $GRILLE % ($GRILLE_MOIS) |
          | Banque de France | $BDF % ($BDF_MOIS) |
          | OAT 10 ans | $OAT % ($OAT_MOIS) |
          | Reference posee | $REFERENCE |

          **Ne pas recopier le chiffre Banque de France.** Il decrit un mois deja
          ancien, et c'est une moyenne realisee sur des prets signes plus tot,
          donc plus basse que les baremes proposes aujourd'hui. Mesure faite sur
          151 mois : l'OAT ne permet pas de corriger ce retard, sa transmission
          vers le taux de credit est de 0,075 avec un R2 de 0,03 a un mois. Voir
          [docs/taux.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/taux.md).

          Marche a suivre : relever les baremes publies du mois en cours sur 15,
          20 et 25 ans, prendre le milieu des fourchettes, puis appliquer

          \`\`\`
          node scripts/maj-taux.mjs --fixer 15ans/20ans/25ans --mois "<mois> <annee>"
          \`\`\`

          Le script verifie les bornes et la croissance avec la duree, remonte le
          parametre \`?v=\` des pages et enregistre la nouvelle reference.
          EOF
          # Une seule issue ouverte a la fois : si celle du mois precedent n'a pas
          # ete traitee, on la commente plutot que d'en empiler une autre.
          EXISTANTE=$(gh issue list --state open --label taux --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTANTE" ]; then
            gh issue comment "$EXISTANTE" --body-file /tmp/corps.md
            echo "Commentaire ajoute a l'issue #$EXISTANTE."
          else
            gh label create taux --description "Grille de taux du simulateur" --color BFD4F2 --force
            gh issue create \
              --title "Taux : verifier la grille (Banque de France $BDF_MOIS)" \
              --body-file /tmp/corps.md \
              --label taux
          fi
